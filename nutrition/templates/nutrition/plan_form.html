<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إضافة خطة تغذية</title>
</head>
<body>
    <h1>خطة تغذية جديدة</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <h2>الوجبات</h2>
        {{ meals_formset.management_form }}

        {% for meal_form in meals_formset %}
            <div>{{ meal_form.as_p }}</div>
        {% endfor %}

        <button type="submit">حفظ</button>
    </form>
</body>
</html>
