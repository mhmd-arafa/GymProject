<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إضافة خطة تمرين</title>
</head>
<body>
    <h1>خطة تمرين جديدة</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <h2>الأيام</h2>
        {{ days_formset.management_form }}

        {% for day_form in days_formset %}
            <div>{{ day_form.as_p }}</div>
        {% endfor %}

        <button type="submit">حفظ</button>
    </form>
</body>
</html>
